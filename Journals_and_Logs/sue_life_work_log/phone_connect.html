
<!DOCTYPE html>
<html>
<head>
    <title>Sue Log 手機連線助手</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        .qr { margin: 20px 0; }
        .url { font-size: 1.2rem; font-weight: bold; color: #a0522d; margin: 10px 0; word-break: break-all; }
        .hint { font-size: 0.9rem; color: #666; margin-top: 20px; text-align: left; }
        .btn { display: inline-block; padding: 10px 20px; background: #a0522d; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📱 手機快速連線</h2>
        <p>請用手機掃描下方 QR Code 進入日誌：</p>
        
        <div class="qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=http://192.168.1.102:5000" alt="QR Code">
        </div>
        
        <div class="url">http://192.168.1.102:5000</div>
        <p>或嘗試固定地址：<br><span class="url">http://LAPTOP-QP2IUK7P.local:5000</span></p>
        
        <div class="hint">
            <strong>💡 連線失敗檢查清單：</strong>
            <ul>
                <li>確認手機與電腦連到<b>同一個 Wi-Fi</b>。</li>
                <li>確認電腦的 <b>restart_server.bat</b> 視窗還開著。</li>
                <li>若 Wi-Fi 是公共網路或公司網路，可能會阻擋裝置互連。</li>
            </ul>
        </div>
    </div>
</body>
</html>
